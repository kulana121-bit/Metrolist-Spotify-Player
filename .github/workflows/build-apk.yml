name: Build Metrolist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP found: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "Extraction completed."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "Searching for gradlew..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside ZIP."
            echo ""
            echo "Top files inside extracted project:"
            find extracted -maxdepth 4 -type f | head -150
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --version

      - name: Build APK and capture full log
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "          STARTING APK BUILD"
          echo "=========================================="

          ./gradlew :app:assembleFossDebug \
            --no-daemon \
            --console=plain \
            2>&1 | tee build-output.txt

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "          ERROR SUMMARY"
          echo "=========================================="

          echo ""
          echo "KOTLIN ERRORS:"
          grep -n -E "e: |error: " build-output.txt | tail -100 || true

          echo ""
          echo "GRADLE ERRORS:"
          grep -n -E "FAILURE:|What went wrong|Execution failed|FAILED" build-output.txt | tail -50 || true

          echo ""
          echo "=========================================="
          echo "        END ERROR SUMMARY"
          echo "=========================================="

          exit $BUILD_EXIT

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Spotify-Player-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Build-Log
          path: |
            ${{ env.PROJECT_DIR }}/build-output.txt
          if-no-files-found: ignore
