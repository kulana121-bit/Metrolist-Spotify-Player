name: Build Metrolist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the uploaded Metrolist ZIP
      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      # 3. Find the actual Gradle project
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "Files found:"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradle wrapper found at:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. Install Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Create Android debug keystore
      - name: Create Android debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created successfully."

      # 6. Make Gradle executable
      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      # 7. Check Gradle
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --version

      # 8. Build Foss Debug APK
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew :app:assembleFossDebug --no-daemon

      # 9. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Spotify-Player-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/**/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/*.apk
          if-no-files-found: error
